<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#146c5a">
  <title>Druckkosten</title>
  <style>
    :root { color-scheme: light dark; --accent:#146c5a; --accent-light:#d9f2eb; --bg:#f5f6f6; --card:#fff; --text:#17201e; --muted:#61706c; --line:#dfe5e3; --danger:#b42318; }
    @media (prefers-color-scheme: dark) { :root { --bg:#101514; --card:#1c2422; --text:#eef4f1; --muted:#a9bbb5; --line:#384440; --accent-light:#173e34; } }
    * { box-sizing:border-box } body { margin:0; background:var(--bg); color:var(--text); font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    button,input { font:inherit } button { cursor:pointer } .app { max-width:700px; min-height:100vh; margin:auto; padding:env(safe-area-inset-top) 16px calc(28px + env(safe-area-inset-bottom)); }
    header { display:flex; align-items:center; justify-content:space-between; padding:18px 2px 12px; } h1 { font-size:34px; letter-spacing:-1px; margin:0 } h2 { margin:0; font-size:18px } .header-actions { display:flex; gap:9px }
    .icon-btn,.primary { border:0; border-radius:12px; min-height:44px; padding:0 14px; font-weight:650; } .icon-btn { background:var(--card); color:var(--accent); border:1px solid var(--line); } .primary { background:var(--accent); color:white; box-shadow:0 3px 8px #0002; } .primary:disabled { opacity:.45 }
    .card { background:var(--card); border:1px solid var(--line); border-radius:16px; margin:12px 0; overflow:hidden; } .summary { padding:15px 16px; display:flex; justify-content:space-between; align-items:center; } .summary + .summary { border-top:1px solid var(--line) } .value { font-weight:750; font-size:21px; color:var(--accent) } .section-title { font-weight:700; margin:25px 2px 8px; color:var(--muted); font-size:14px; text-transform:uppercase; letter-spacing:.06em }
    .ticket { display:block; width:100%; text-align:left; padding:15px 16px; border:0; border-bottom:1px solid var(--line); background:var(--card); color:var(--text); } .ticket:last-child { border-bottom:0 } .ticket-row { display:flex; justify-content:space-between; gap:12px; align-items:center; } .ticket-name { font-weight:700; font-size:17px } .ticket-cost { font-weight:750; color:var(--accent); font-size:17px } .meta { color:var(--muted); margin-top:5px; font-size:14px } .empty { padding:42px 22px; color:var(--muted); text-align:center; line-height:1.45 }
    dialog { border:0; padding:0; max-width:700px; width:100%; min-height:100%; margin:auto; background:var(--bg); color:var(--text); } dialog::backdrop { background:#0008 } .modal { padding:env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom)); } .modal-head { display:flex; align-items:center; justify-content:space-between; padding:18px 2px; position:sticky; top:0; background:var(--bg); z-index:1; }.close { color:var(--accent); background:none; border:0; padding:10px 2px; font-weight:700 }
    .form-section { background:var(--card); border:1px solid var(--line); border-radius:15px; margin:12px 0; overflow:hidden } .form-label { padding:14px 16px 7px; font-size:14px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.05em } label.field { display:block; padding:10px 16px; border-top:1px solid var(--line) } label.field:first-of-type { border-top:0 } .field-name { display:block; font-weight:650; margin-bottom:5px } .hint { display:block; color:var(--muted); font-size:13px; line-height:1.3; margin:4px 0 8px } input { width:100%; border:1px solid var(--line); background:var(--bg); color:var(--text); border-radius:9px; padding:10px; min-height:42px; } input:focus { outline:2px solid var(--accent); outline-offset:1px } .form-footer { padding-top:8px } .form-footer .primary { width:100% }
    .detail-title { margin:4px 0 18px; font-size:28px }.detail-card { padding:0 16px } .detail-card h2 { padding:17px 0 8px; color:var(--muted); font-size:14px; text-transform:uppercase; letter-spacing:.05em }.line { display:flex; justify-content:space-between; gap:14px; padding:11px 0; border-top:1px solid var(--line) }.line span:last-child { text-align:right }.total { font-size:18px; font-weight:750; color:var(--accent) }.delete { width:100%; color:var(--danger); background:var(--card); border:1px solid #e8b4af; border-radius:12px; min-height:46px; margin-top:20px; font-weight:700 }
    .notice { margin:16px 2px 2px; color:var(--muted); font-size:13px; line-height:1.45 }
  </style>
</head>
<body>
  <main class="app">
    <header><div></div><div class="header-actions"><button class="icon-btn" id="exportBtn">CSV</button><button class="primary" id="newBtn">＋ Druck</button></div></header>
    <section class="card"><div class="summary"><span>Gesamtkosten</span><span class="value" id="total">0,00 €</span></div><div class="summary"><span>Gespeicherte Drucke</span><span id="count">0</span></div></section>
    <div class="section-title">Druckhistorie</div><section class="card" id="tickets"></section>
    <p class="notice">Alle Daten bleiben nur auf diesem Gerät in deinem Browser gespeichert.</p>
  </main>
  <dialog id="formDialog"><div class="modal"><div class="modal-head"><h2 id="formTitle">Ticket erfassen</h2><button class="close" data-close="formDialog">Abbrechen</button></div>
    <form id="jobForm">
      <section class="form-section"><div class="form-label">Druck</div>
        <label class="field"><span class="field-name">Name</span><input name="name" value="Neuer Druck" required></label>
        <label class="field"><span class="field-name">Drucker</span><input name="printer" value="Bambu Lab P2S" required></label>
        <label class="field"><span class="field-name">Material</span><input name="material" value="PLA" required></label>
        <label class="field"><span class="field-name">Druckdatum</span><input name="date" type="date" required></label>
      </section>
      <section class="form-section"><div class="form-label">Verbrauch</div>
        <label class="field"><span class="field-name">Dauer (Stunden)</span><span class="hint">Wie lange der Druck insgesamt gedauert hat.</span><input name="duration" type="number" inputmode="decimal" step="0.01" min="0" value="1" required></label>
        <label class="field"><span class="field-name">Filament (Gramm)</span><span class="hint">Die für diesen Druck tatsächlich verbrauchte Menge.</span><input name="grams" type="number" inputmode="decimal" step="0.1" min="0" value="50" required></label>
        <label class="field"><span class="field-name">Filamentpreis (€/kg)</span><span class="hint">Dein Kaufpreis für ein Kilogramm dieses Materials.</span><input name="filamentPrice" type="number" inputmode="decimal" step="0.01" min="0" value="20" required></label>
      </section>
      <section class="form-section"><div class="form-label">Strom</div>
        <label class="field"><span class="field-name">Leistungsaufnahme (Watt)</span><span class="hint">Durchschnittliche Leistung des Druckers während des Drucks.</span><input name="watts" type="number" inputmode="decimal" step="1" min="0" value="120" required></label>
        <label class="field"><span class="field-name">Strompreis (€/kWh)</span><span class="hint">Der Preis aus deinem Stromtarif pro Kilowattstunde.</span><input name="electricity" type="number" inputmode="decimal" step="0.01" min="0" value="0.35" required></label>
      </section>
      <section class="form-section"><div class="form-label">Vorschau</div><div class="detail-card"><div class="line"><span>Filamentkosten</span><span id="prevFilament"></span></div><div class="line"><span>Stromkosten</span><span id="prevElectricity"></span></div><div class="line total"><span>Gesamtkosten</span><span id="prevTotal"></span></div></div></section>
      <div class="form-footer"><button class="primary" id="saveTicket" type="submit">Ticket speichern</button></div>
    </form>
  </div></dialog>
  <dialog id="detailDialog"><div class="modal"><div class="modal-head"><button class="close" data-close="detailDialog">‹ Zurück</button></div><div id="detail"></div></div></dialog>
  <script>
    const key = 'druckkosten-p2s-web-v1';
    let jobs = [];
    try { jobs = JSON.parse(localStorage.getItem(key) || '[]'); } catch (_) {}
    const euros = n => new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(n || 0);
    const num = value => Number(String(value).replace(',', '.')) || 0;
    const cost = j => ({filament:j.grams / 1000 * j.filamentPrice, electricity:j.duration * j.watts / 1000 * j.electricity});
    const esc = s => String(s).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    function save() { localStorage.setItem(key, JSON.stringify(jobs)); }
    function render() {
      const total = jobs.reduce((sum,j) => { const c=cost(j); return sum+c.filament+c.electricity }, 0);
      document.querySelector('#total').textContent = euros(total); document.querySelector('#count').textContent = jobs.length;
      const box = document.querySelector('#tickets');
      box.innerHTML = jobs.length ? jobs.sort((a,b)=>b.date.localeCompare(a.date)).map(j => {const c=cost(j);return `<button class="ticket" data-id="${j.id}"><div class="ticket-row"><span class="ticket-name">${esc(j.name)}</span><span class="ticket-cost">${euros(c.filament+c.electricity)}</span></div><div class="meta">${esc(j.printer)} · ${esc(j.material)} · ${j.grams.toLocaleString('de-DE')} g</div><div class="meta">${new Date(j.date+'T12:00:00').toLocaleDateString('de-DE')}</div></button>`}).join('') : '<div class="empty">Noch keine Drucke.<br>Lege deinen ersten Druck über „＋ Druck“ an.</div>';
    }
    const form = document.querySelector('#jobForm'); const formDialog = document.querySelector('#formDialog'); let editingId = null;
    function formValues() { const d=new FormData(form); return {duration:num(d.get('duration')), grams:num(d.get('grams')), filamentPrice:num(d.get('filamentPrice')), watts:num(d.get('watts')), electricity:num(d.get('electricity'))}; }
    function preview() { const c=cost(formValues()); document.querySelector('#prevFilament').textContent=euros(c.filament); document.querySelector('#prevElectricity').textContent=euros(c.electricity); document.querySelector('#prevTotal').textContent=euros(c.filament+c.electricity); }
    function openForm(job = null) {
      editingId = job?.id ?? null;
      document.querySelector('#formTitle').textContent = job ? 'Ticket bearbeiten' : 'Ticket erfassen';
      document.querySelector('#saveTicket').textContent = job ? 'Änderungen speichern' : 'Ticket speichern';
      form.reset();
      if (job) Object.entries({name:job.name,printer:job.printer,material:job.material,date:job.date,duration:job.duration,grams:job.grams,filamentPrice:job.filamentPrice,watts:job.watts,electricity:job.electricity}).forEach(([name,value]) => form.elements[name].value = value);
      else form.elements.date.value = new Date().toISOString().slice(0,10);
      preview(); formDialog.showModal();
    }
    document.querySelector('#newBtn').onclick=()=>openForm();
    form.addEventListener('input',preview); form.addEventListener('submit',e=>{e.preventDefault();const d=new FormData(form),v=formValues();const ticket={id:editingId || crypto.randomUUID(),name:d.get('name'),printer:d.get('printer'),material:d.get('material'),date:d.get('date'),...v};if(editingId) jobs=jobs.map(j=>j.id===editingId?ticket:j);else jobs.push(ticket);save();render();formDialog.close()});
    document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>document.querySelector('#'+b.dataset.close).close());
    document.querySelector('#tickets').onclick=e=>{const b=e.target.closest('[data-id]');if(b) showDetail(b.dataset.id)};
    function showDetail(id) { const j=jobs.find(x=>x.id===id); if(!j)return; const c=cost(j),total=c.filament+c.electricity; document.querySelector('#detail').innerHTML=`<h1 class="detail-title">${esc(j.name)}</h1><section class="card detail-card"><h2>Druck</h2><div class="line"><span>Drucker</span><span>${esc(j.printer)}</span></div><div class="line"><span>Datum</span><span>${new Date(j.date+'T12:00:00').toLocaleDateString('de-DE')}</span></div><div class="line"><span>Material</span><span>${esc(j.material)}</span></div></section><section class="card detail-card"><h2>Verbrauch</h2><div class="line"><span>Druckdauer</span><span>${j.duration.toLocaleString('de-DE')} Stunden</span></div><div class="line"><span>Filament</span><span>${j.grams.toLocaleString('de-DE')} g</span></div><div class="line"><span>Filamentpreis</span><span>${euros(j.filamentPrice)} / kg</span></div><div class="line"><span>Leistungsaufnahme</span><span>${j.watts.toLocaleString('de-DE')} Watt</span></div><div class="line"><span>Strompreis</span><span>${euros(j.electricity)} / kWh</span></div></section><section class="card detail-card"><h2>Kostenaufstellung</h2><div class="line"><span>Filamentkosten</span><span>${euros(c.filament)}</span></div><div class="line"><span>Stromkosten</span><span>${euros(c.electricity)}</span></div><div class="line total"><span>Gesamtkosten</span><span>${euros(total)}</span></div></section><button class="primary" id="editTicket" style="width:100%;margin-top:18px">Ticket bearbeiten</button><button class="delete" id="deleteTicket">Ticket löschen</button>`; document.querySelector('#editTicket').onclick=()=>{document.querySelector('#detailDialog').close();openForm(j)}; document.querySelector('#deleteTicket').onclick=()=>{if(confirm('Dieses Ticket wirklich löschen?')){jobs=jobs.filter(x=>x.id!==id);save();render();document.querySelector('#detailDialog').close()}}; document.querySelector('#detailDialog').showModal(); }
    document.querySelector('#exportBtn').onclick=()=>{if(!jobs.length)return;const header='Datum;Druck;Drucker;Dauer (h);Material;Filament (g);Filamentkosten (€);Stromkosten (€);Gesamt (€)';const rows=jobs.map(j=>{const c=cost(j);return [j.date,j.name,j.printer,j.duration,j.material,j.grams,c.filament,c.electricity,c.filament+c.electricity].map(x=>String(x).replaceAll(';',',')).join(';')});const blob=new Blob([[header,...rows].join('\n')],{type:'text/csv;charset=utf-8'});const file=new File([blob],'druckhistorie.csv',{type:blob.type});if(navigator.share&&navigator.canShare?.({files:[file]}))navigator.share({files:[file],title:'Druckhistorie'});else {const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='druckhistorie.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}};
    render();
  </script>
</body>
</html>
